<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Dashboard - Administration - Nouvelle entreprise</title>
  <link rel="stylesheet" href="../../css/style-admin.css">
  <link rel="icon" type="image/png" href="../../../../../../../img/icon.png" />
  <!-- Font Awesome Cdn Link -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>
</head>
<body class="body-admin" style="background: url(../../img/background.png) no-repeat center center fixed;">
  <!-- Haut de page -->
  <div class="main-top">
    <div class="menu-toggle">
      <i class="fas fa-bars"></i>
    </div>
    <div class="titre-navbar">Dashboard</div>
  </div>

  <!-- Navigation latérale -->
  <nav class="nav-laterale">
    <ul>
      <br><br><br>
      <li>
        <a class="nom-nav" href="/">
          <i class="fas fa-home"></i>
          <span class="nav-item">Home</span>
        </a>
      </li>
      <li>
        <a class="nom-nav" href="/admin/entreprise">
          <i class="fas fa-store-alt"></i>
          <span class="nav-item">Entreprises</span>
        </a>
      </li>
      <li>
        <a class="nom-nav" href="/admin/offre">
          <i class="fas fa-clipboard-list"></i>
          <span class="nav-item">Offres</span>
        </a>
      </li>
      <li>
        <a class="nom-nav" href="/admin/pilote">
          <i class="fas fa-user-tie"></i>
          <span class="nav-item">Pilotes</span>
        </a>
      </li>
      <li>
        <a class="nom-nav" href="/admin/etudiants">
          <i class="fas fa-user-graduate"></i>
          <span class="nav-item">Étudiants</span>
        </a>
      </li>
      <li>
        <a class="nom-nav" href="/admin/candidatures">
          <i class="fas fa-tasks"></i>
          <span class="nav-item">Candidatures</span>
        </a>
      </li>
      <li>
        <a class="nom-nav" href="/admin">
          <i class="fas fa-chart-bar"></i>
          <span class="nav-item">Statistiques</span>
        </a>
      </li>
      <li>
        <a class="nom-nav" href="/profile">
          <i class="fas fa-user"></i>
          <span class="nav-item">Profil</span>
        </a>
      </li>
      <li>
        <a class="nom-nav logout" href="/logout">
          <i class="fas fa-sign-out-alt"></i>
          <span class="nav-item">Déconnexion</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Contenu principal -->
  <section class="container-admin">
    <!-- Message de succès (affiché après la création de l'entreprise) -->
    <!-- <div class="alert alert-success">
         L'entreprise a bien été créée
    </div> -->

    <div class="container-modifier">
      <h1 class="grand-titre">Nouvelle entreprise</h1>
      <form action="" method="POST" enctype="multipart/form-data" class="verif">
        <div class="form-group">
          <label for="nomEnt">Nom Entreprise</label>
          <input type="text" name="nomEnt" id="nomEnt" class="form-control" value="">
        </div>
        <div class="form-group">
          <label for="secteurActivite">Secteur d'activité *</label>
          <select name="secteurActivite" class="form-control" id="secteurActivite" required>
            <option value="1">Secteur 1</option>
            <option value="2">Secteur 2</option>
            <option value="3">Secteur 3</option>
          </select>
        </div>
        <div class="form-group">
          <label for="fileToUpload" class="form-label">Logo :</label>
          <input class="fichier-logo" type="file" name="fileToUpload" id="fileToUpload">
        </div>
        <div class="form-group" id="adresses">
          <!-- Les adresses seront ajoutées ici dynamiquement -->
        </div>
        <div class="form-group">
          <label for="nbrAdresse">Nombre d'Adresses</label>
          <input type="number" name="nbrAdresse" id="nbrAdresse" class="form-control" value="0">
        </div>
        <button type="submit" class="btn btn-primary" onsubmit="validerFormulaire()">Creer</button>
      </form>
    </div>
  </section>

  <script src="/js/script.js"></script>
  <script src="/js/script-admin.js"></script>
</body>
</html>

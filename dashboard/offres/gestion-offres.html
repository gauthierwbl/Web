<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Page Admin</title>
  <link rel="stylesheet" href="../../css/style-admin.css">
  <link rel="icon" type="image/png" href="../../../../../../../img/icon.png" />
  <!-- Font Awesome Cdn Link -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>
</head>
<body class="body-admin" style="background: url(../../img/background.png) no-repeat center center fixed;">
  <!-- Haut de page -->
  <div class="main-top">
    <div class="menu-toggle">
      <i class="fas fa-bars"></i>
    </div>
    <div class="titre-navbar">Dashboard</div>
  </div>

  <!-- Navigation latérale -->
  <nav class="nav-laterale">
    <ul>
      <br><br><br>
      <li>
        <a class="nom-nav" href="/">
          <i class="fas fa-home"></i>
          <span class="nav-item">Home</span>
        </a>
      </li>
      <li>
        <a class="nom-nav" href="/admin/entreprise">
          <i class="fas fa-store-alt"></i>
          <span class="nav-item">Entreprises</span>
        </a>
      </li>
      <li>
        <a class="nom-nav" href="/admin/offre">
          <i class="fas fa-clipboard-list"></i>
          <span class="nav-item">Offres</span>
        </a>
      </li>
      <!-- Bloc conditionnel pour les administrateurs (exemple statique) -->
      <li>
        <a class="nom-nav" href="/admin/pilote">
          <i class="fas fa-user-tie"></i>
          <span class="nav-item">Pilotes</span>
        </a>
      </li>
      <li>
        <a class="nom-nav" href="/admin/etudiants">
          <i class="fas fa-user-graduate"></i>
          <span class="nav-item">Etudiants</span>
        </a>
      </li>
      <li>
        <a class="nom-nav" href="/admin/candidatures">
          <i class="fas fa-tasks"></i>
          <span class="nav-item">Candidatures</span>
        </a>
      </li>
      <li>
        <a class="nom-nav" href="/admin">
          <i class="fas fa-chart-bar"></i>
          <span class="nav-item">Statistiques</span>
        </a>
      </li>
      <li>
        <a class="nom-nav" href="/profile">
          <i class="fas fa-user"></i>
          <span class="nav-item">Profil</span>
        </a>
      </li>
      <li>
        <a class="nom-nav logout" href="/logout">
          <i class="fas fa-sign-out-alt"></i>
          <span class="nav-item">Déconnexion</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Contenu principal -->
  <section class="container-admin">
    <br><br>
    <div class="container-edit-offre">
      <div class="top-box-position">
        <h1 class="grand-titre">Gestion des Offres</h1>
        <form action="" method="get">
          <input class="form-control" type="search" name="terme" aria-label="Entrez votre terme de recherche">
          <input class="btn btn-recherche" type="submit" name="submit" value="Rechercher" aria-label="Rechercher">
        </form>
        <a href="admin-offre-add.html" class="btn btn-primary">Ajouter</a>
      </div>
      <table>
        <thead>
          <tr>
            <th class="titre-tableau">#id</th>
            <th class="titre-tableau">Offres</th>
            <th class="titre-tableau">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>
              <a class="texte-tableau" href="admin-offre.html">1</a>
            </td>
            <td>
              <a class="texte-tableau" href="admin-entreprise.html">Offre Exemple</a>
            </td>
            <td>
              <a href="admin-offre-edit.html" class="btn btn-primary-offre">
                <span class="sr-only">Modifier l'offre</span>
                <i class="fas fa-edit"></i>
              </a>
              <form action="admin-offre-delete.html" method="POST" style="display: inline;" onsubmit="return confirm('Voulez-vous supprimer cette offre ?')">
                <button class="btn btn-danger-offre">
                  <span class="sr-only">Supprimer l'offre</span>
                  <i class="fas fa-trash"></i>
                </button>
              </form>
            </td>
          </tr>
          <!-- Vous pouvez ajouter d'autres lignes ici -->
        </tbody>
      </table>
      <div class="pagination">
        <div class="container-pagination-precedente">
          <a href="admin-offre.html?page=prev" class="pagination-entreprise-precedente">Page Précédente</a>
        </div>
        <div class="container-pagination-suivante">
          <a href="admin-offre.html?page=next" class="pagination-entreprise-suivante">Page Suivante</a>
        </div>
      </div>
    </div>
  </section>

  <script src="/js/script.js"></script>
  <script src="/js/script-admin.js"></script>
</body>
</html>
